<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Español con Mones</title>
<script>
/* GitHub Pages fallback: send any unknown path back to the app (hash routes). */
(function () {
  var l = window.location, base = l.pathname.split('/').slice(0, 2).join('/') + '/';
  if (l.hostname.indexOf('github.io') === -1) base = '/';
  l.replace(base + (l.hash || '#/'));
})();
</script>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#F8F4EA;color:#0E2240;text-align:center;padding:60px 16px}a{color:#0E7C5A}</style>
</head>
<body><p>جارٍ تحويلك إلى التطبيق… <a href="./">اضغط هنا إن لم يحدث التحويل</a></p></body>
</html>
