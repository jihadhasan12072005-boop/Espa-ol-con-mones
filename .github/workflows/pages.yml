name: Build and deploy to GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Stamp asset versions (cache busting for Safari after each update)
        run: sed -i "s/?v=[0-9A-Za-z]*/?v=${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy (default branch only)
    needs: check
    # Deploy only from the repository's default branch (main, master, ...).
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check page, nested-route fallback and key assets on the published URL
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          echo "Published at: $URL"
          sleep 20
          curl -fsS "$URL" | grep -q "Español con Mones"
          for f in css/app.css js/core/app.js js/data/ccse.js img/photos/granvia.jpg img/photos/thumb/cafe.jpg fonts/plex-arabic-400.woff2 img/icon.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$f"); echo "$f -> $code"; test "$code" = 200
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}learn/A2"); echo "nested path -> $code (404.html redirects to the app)"
          curl -s "${URL}learn/A2" | grep -q "l.replace"
          echo "Live site verified."
