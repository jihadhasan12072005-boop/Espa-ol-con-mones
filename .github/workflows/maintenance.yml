name: Maintenance (CCSE manual check, extra photos)

# Development helpers. They run only when the helper scripts change on a claude/** branch,
# or manually from the Actions tab. They never deploy anything.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/inspect_ccse_manual.py', 'scripts/fetch_photo_candidates.py']

permissions:
  contents: write

jobs:
  ccse-manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - run: python scripts/inspect_ccse_manual.py

  photos-batch2:
    runs-on: ubuntu-latest
    needs: ccse-manual
    if: false   # batch 2 done; re-enable when new photos are needed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: BATCH=2 python scripts/fetch_photo_candidates.py photo-candidates
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-candidates
          git commit -m "Add photo/map candidates (batch 2) for review" || echo "nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
