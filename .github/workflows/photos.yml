name: Fetch photo candidates (maintenance)

# One-off helper used while building the app: downloads freely licensed
# photos of Spain from Wikimedia Commons so they can be reviewed and the
# best ones committed into site/img/photos. Not needed for normal deploys.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/fetch_photo_candidates.py']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/fetch_photo_candidates.py photo-candidates
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-candidates
          git commit -m "Add Wikimedia photo candidates for review" || echo "nothing to commit"
          git push
